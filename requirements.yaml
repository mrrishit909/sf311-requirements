# Step 5: the requirements. The single source: spec.py builds docs/requirements.md and results/traceability.csv
# from this file, and check.py fails if a cited number no longer matches the results file it points at.
# Each evidence item is {file, where, column, value}: the row of results/<file> matching `where`, column `column`.
# Targets are proposals for the service owners to agree, not commitments; baselines are the 12 months Sep 2025 - Aug 2026.

requirements:
  - id: REQ-01
    title: Warn about an open case nearby before a duplicate is filed
    type: Functional
    priority: Should
    stakeholders: [Residents, Field crews (Public Works, SFMTA)]
    problem: >-
      70,526 closed cases ended as duplicates. Crews open, read and close each one. A warning works only where nearby
      open cases really are the same issue: in four services 32-54% of the cases the rule flags were closed as
      duplicates; in street cleaning only 7.5% were.
    statement: >-
      When a resident reports a Parking Enforcement, Graffiti Private, Sidewalk and Curb or Street Defect issue, the form
      shall show any open case of the same service and subtype within 50 m opened in the last 3 days, and let the
      resident follow that case instead of filing a new one.
    acceptance:
      - Given an open Street Defect case 40 m away opened 2 days ago, when a resident starts a Street Defect report there, then the form shows that case and a "same issue - follow it" option before submit.
      - Given the nearest open case of the same subtype is 60 m away or opened 4 days ago, when the resident submits, then no warning is shown.
      - In a 3-month pilot, at least 30% of warnings shown lead to "follow" or to a duplicate closure (spike baseline 32.5-53.6%).
    target: Duplicate closures in the four services down by a third (baseline 28,040 a year with location).
    evidence:
      - {file: outcomes.csv, where: {outcome: duplicate}, column: cases, value: 70526}
      - {file: duplicate_spike_by_service.csv, where: {service: Parking Enforcement}, column: flagged_closed_as_duplicate_pct, value: 32.5}
      - {file: duplicate_spike_by_service.csv, where: {service: Graffiti Private}, column: flagged_closed_as_duplicate_pct, value: 40.9}
      - {file: duplicate_spike_by_service.csv, where: {service: Sidewalk and Curb}, column: flagged_closed_as_duplicate_pct, value: 44.2}
      - {file: duplicate_spike_by_service.csv, where: {service: Street Defect}, column: flagged_closed_as_duplicate_pct, value: 53.6}
      - {file: duplicate_spike_by_service.csv, where: {service: Street and Sidewalk Cleaning}, column: flagged_closed_as_duplicate_pct, value: 7.5}
      - {file: duplicate_spike_by_service.csv, where: {service: Parking Enforcement}, column: closed_as_duplicate, value: 12308}
      - {file: duplicate_spike_by_service.csv, where: {service: Graffiti Private}, column: closed_as_duplicate, value: 8419}
      - {file: duplicate_spike_by_service.csv, where: {service: Sidewalk and Curb}, column: closed_as_duplicate, value: 3620}
      - {file: duplicate_spike_by_service.csv, where: {service: Street Defect}, column: closed_as_duplicate, value: 3693}

  - id: REQ-02
    title: Attend time-sensitive parking complaints within an hour
    type: Non-functional (service level)
    priority: Must
    stakeholders: [Residents with a blocked driveway, SFMTA Parking Enforcement]
    problem: >-
      75,952 parking and encampment cases closed as "unable to locate" because the car or people had gone. For
      time-sensitive parking complaints (illegal parking, parking on a sidewalk, blocked driveway) the share of cars gone
      rises with waiting time: 27.4% when the case closes within an hour, 62.5% at 4-8 hours. The median case takes
      2.16 hours to close and only 18.8% close within an hour.
    statement: >-
      Illegal-parking, sidewalk-parking and blocked-driveway requests shall be attended within 1 hour of submission for at
      least half of requests, measured monthly from submission to officer arrival.
    acceptance:
      - Given a month of these requests, when arrival times are measured, then at least 50% are attended within 60 minutes.
      - Given an officer arrives at one of these requests, then an arrival timestamp is stored separately from closure for 100% of attended requests (today only closure time exists).
    target: 50% within 1 hour (baseline 18.8% closed within 1 hour).
    evidence:
      - {file: outcomes.csv, where: {outcome: not_found_on_arrival}, column: cases, value: 75952}
      - {file: parking_response.csv, where: {time_to_close: "1: under 1 h"}, column: gone_pct, value: 27.4}
      - {file: parking_response.csv, where: {time_to_close: "4: 4-8 h"}, column: gone_pct, value: 62.5}
      - {file: parking_response_summary.csv, where: {}, column: median_hours, value: 2.16}
      - {file: parking_response_summary.csv, where: {}, column: pct_within_1h, value: 18.8}

  - id: REQ-03
    title: Send non-city issues to their owner before a case is created
    type: Functional
    priority: Should
    stakeholders: [Residents, 311 agents, departments receiving misrouted cases]
    problem: >-
      26,359 closed cases went to the wrong agency, including 5,327 for the US Postal Service, 2,724 for police
      non-emergency and 712 for PG&E, which the City cannot act on.
    statement: >-
      When the selected category or location belongs to an owner outside the City (USPS mail boxes and mail delivery,
      PG&E poles and lines, state highways), the form shall show that owner's reporting channel and create a City case
      only if the resident confirms the issue is the City's.
    acceptance:
      - Given a resident selects "mail box" or mentions USPS in the description, when they continue, then the form shows the USPS contact and a "this is a City issue" override before any case is created.
      - In-progress noise or crime reports are directed to police non-emergency (415-553-0123) before submission.
      - Wrong-agency closures for USPS, PG&E, police and State destinations fall by at least 50% within 6 months (baseline 9,364 a year).
    target: Half of the 9,364 a year misrouted to USPS, police, PG&E and the State never become City cases.
    evidence:
      - {file: outcomes.csv, where: {outcome: wrong_agency}, column: cases, value: 26359}
      - {file: wrong_agency_destinations.csv, where: {sent_to: US Postal Service}, column: cases, value: 5327}
      - {file: wrong_agency_destinations.csv, where: {sent_to: Police (non-emergency)}, column: cases, value: 2724}
      - {file: wrong_agency_destinations.csv, where: {sent_to: PG&E (not a city agency)}, column: cases, value: 712}
      - {file: wrong_agency_destinations.csv, where: {sent_to: State / Caltrans}, column: cases, value: 601}

  - id: REQ-04
    title: Replace the "General Request" catch-all with guided questions
    type: Functional
    priority: Should
    stakeholders: [Residents, 311 agents, receiving departments]
    problem: >-
      General Request is the catch-all category, and 43.1% of its 59,311 closed cases ended at intake: unable to locate,
      wrong agency, out of scope or duplicate. That is the highest intake-failure rate of any large service.
    statement: >-
      A resident who cannot find a category shall answer at most three questions (what, where, is it on City property),
      and the answers shall route the report to a specific service or to an outside owner (REQ-03).
    acceptance:
      - Given a resident chooses "something else", when they answer the three questions, then the report is created in a named service, or an outside owner's contact is shown.
      - General Request intake failure falls from 43.1% to 25% or lower in the quarter after launch.
    target: 25% or lower (baseline 43.1%).
    evidence:
      - {file: intake_failures_by_service.csv, where: {service: General Request}, column: intake_failure_pct, value: 43.1}
      - {file: intake_failures_by_service.csv, where: {service: General Request}, column: closed_cases, value: 59311}

  - id: REQ-05
    title: Bring the phone agent's prompts to the web form
    type: Functional
    priority: Could
    stakeholders: [Residents using the web form, 311 call-centre leads]
    problem: >-
      After allowing for what each channel is used for, web reports fail at intake 8% more often than their service mix
      predicts (19.9% vs 18.4% expected), while phone reports, where an agent asks questions, fail 13% less often.
    statement: >-
      For the five services with the most intake failures, the web form shall ask the same clarifying questions the phone
      script asks, before the report can be submitted.
    acceptance:
      - Given an A/B test of the current and guided web forms over 8 weeks, when intake failures are compared within service, then the guided form's rate is at least 1 percentage point lower.
    target: Web observed-vs-expected ratio from 1.08 to 1.00 or lower.
    evidence:
      - {file: intake_failure_by_channel.csv, where: {channel: Web}, column: observed_vs_expected, value: 1.08}
      - {file: intake_failure_by_channel.csv, where: {channel: Phone}, column: observed_vs_expected, value: 0.87}
      - {file: intake_failure_by_channel.csv, where: {channel: Web}, column: intake_failure_pct, value: 19.9}
      - {file: intake_failure_by_channel.csv, where: {channel: Web}, column: expected_from_service_mix_pct, value: 18.4}

  - id: REQ-06
    title: Record why a case closed as a coded reason
    type: Data
    priority: Must
    stakeholders: [Department managers, 311 performance team, residents reading their case status]
    problem: >-
      Closure reasons are free text: 243,054 different closure notes in a year, 128,370 different ways of saying
      "resolved" and 20,591 of saying "duplicate", and 4,749 closed cases with no note at all. Every other requirement
      here had to be measured with 14 hand-written text rules, and could not otherwise be measured at all.
    statement: >-
      Every closed case shall carry a closure reason from a controlled list (resolved, duplicate of case <id>, not found on
      arrival, outside owner <name>, insufficient information, no work needed, cancelled, administrative). Free-text notes
      stay optional.
    acceptance:
      - Given a case is closed, then closure_reason is one of the listed values and never empty.
      - Given closure_reason is "duplicate", then duplicate_of holds the id of an existing earlier case.
      - Given the monthly open-data extract, then closure_reason is its own column and 0 closed rows leave it empty.
    target: 100% of closures coded (baseline 0%; 4,749 have no note).
    evidence:
      - {file: taxonomy_quality.csv, where: {}, column: distinct_closure_notes, value: 243054}
      - {file: taxonomy_quality.csv, where: {}, column: distinct_notes_meaning_resolved, value: 128370}
      - {file: taxonomy_quality.csv, where: {}, column: distinct_notes_meaning_duplicate, value: 20591}
      - {file: taxonomy_quality.csv, where: {}, column: closed_without_note, value: 4749}

  - id: REQ-07
    title: A case cannot close before it was opened
    type: Data
    priority: Must
    stakeholders: [311 performance team, open-data users]
    problem: 1,451 closed cases have a closing time earlier than the time they were opened, which breaks every time-to-close measure.
    statement: The system shall reject a closure whose timestamp is earlier than the case's requested timestamp.
    acceptance:
      - Given a case opened at 10:00, when a closure at 09:59 the same day is saved, then the save is rejected with a message.
      - The monthly extract contains 0 cases closed before they were opened.
    target: 0 (baseline 1,451).
    evidence:
      - {file: taxonomy_quality.csv, where: {}, column: closed_before_requested, value: 1451}

  - id: REQ-08
    title: Take the busiest minute five times over
    type: Non-functional (capacity)
    priority: Must
    stakeholders: [Residents, IT operations]
    problem: >-
      The busiest minute of the year brought 106 new cases, the busiest hour 584 and the busiest day 3,472 (mean 2,385).
      Up to 10 cases share one timestamp, so integrations submit in bursts.
    statement: >-
      Intake shall accept 530 submissions a minute (five times the observed peak) with 95% of submissions confirmed
      within 2 seconds, and shall accept a burst of 50 submissions in the same second from an integration.
    acceptance:
      - Given a load test of 530 submissions per minute for 15 minutes, then the 95th-percentile confirmation time is 2 seconds or less and no submission is lost.
      - Given 50 submissions in the same second, then all 50 are stored with distinct case ids.
    target: 530 a minute (baseline peak 106).
    evidence:
      - {file: load_profile.csv, where: {}, column: peak_per_minute, value: 106}
      - {file: load_profile.csv, where: {}, column: peak_per_hour, value: 584}
      - {file: load_profile.csv, where: {}, column: peak_per_day, value: 3472}
      - {file: load_profile.csv, where: {}, column: mean_per_day, value: 2385}
      - {file: load_profile.csv, where: {}, column: max_same_second, value: 10}

# Candidate requirements the evidence does not support. Recorded so nobody builds them on instinct.
rejected:
  - id: REJ-01
    title: Make a map pin mandatory
    reason: >-
      Outside parking and encampments, cases without coordinates end "unable to locate" 3.37% of the time against 3.07%
      with them. Location entry is not the problem.
    evidence:
      - {file: location_quality.csv, where: {has_coordinates: "false"}, column: cannot_locate_pct, value: 3.37}
      - {file: location_quality.csv, where: {has_coordinates: "true"}, column: cannot_locate_pct, value: 3.07}
  - id: REJ-02
    title: Make a photo mandatory on the mobile app
    reason: >-
      Mobile reports with a photo end "unable to locate" 2.28% of the time, against 2.25% expected from their service
      mix; without a photo, 2.2% against 2.3%. A photo makes no measurable difference to finding the issue.
    evidence:
      - {file: photo_effect.csv, where: {has_photo: "true"}, column: cannot_locate_pct, value: 2.28}
      - {file: photo_effect.csv, where: {has_photo: "true"}, column: cannot_locate_expected_pct, value: 2.25}
      - {file: photo_effect.csv, where: {has_photo: "false"}, column: cannot_locate_pct, value: 2.2}
      - {file: photo_effect.csv, where: {has_photo: "false"}, column: cannot_locate_expected_pct, value: 2.3}
  - id: REJ-03
    title: Duplicate warning for street and sidewalk cleaning
    reason: >-
      The REQ-01 rule would warn on 36.1% of street-cleaning reports, and only 7.5% of those warnings point at a case later
      closed as a duplicate. Busy blocks get many separate piles of rubbish.
    evidence:
      - {file: duplicate_spike_by_service.csv, where: {service: Street and Sidewalk Cleaning}, column: flag_rate_pct, value: 36.1}
      - {file: duplicate_spike_by_service.csv, where: {service: Street and Sidewalk Cleaning}, column: flagged_closed_as_duplicate_pct, value: 7.5}
